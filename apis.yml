name: Dazz
description: 'Dazz is a cloud security company specializing in Application Security
  Posture Management (ASPM) and code-to-cloud risk remediation. Its platform correlates
  findings across code, cloud, and on-prem infrastructure into a single unified view,
  maps vulnerabilities back to their root cause in source code, and gives security
  and engineering teams a remediation engine to prioritize and fix issues across the
  application lifecycle. Co-founded and led by CEO Merav Bahat, Dazz was backed by
  Insight Partners, Greylock, Cyberstarts, and others. Wiz announced its acquisition
  of Dazz on November 21, 2024 to extend its Cloud Native Application Protection Platform
  (CNAPP) with Dazz''s remediation capabilities; the dazz.io domain now redirects into
  Wiz. This profile has no independent public developer/API surface.'
